# Vidocq port: this file replaces Open Liberty's server.xml.
#
# Everything Liberty declared as <featureManager> features is now a Maven dependency
# (see bot/pom.xml); what remains here is the configuration those features used to read
# from server.xml. Values can be overridden per environment through MicroProfile Config,
# e.g. VIDOCQ_POOL_URL for vidocq.pool.url.

# --- HTTP listener (was <httpEndpoint> / <httpOptions>) ---
# vidocq.http.host/port are the aliases for the Chappe listener named 'default'
# (vidocq.chappe.listener.default.host/port). They are what `vidocq create` scaffolds and
# what `vidocq:doctor` checks, so prefer them. Override per run with -Dvidocq.http.port=18080.
vidocq.http.host=0.0.0.0
vidocq.http.port=8080

# --- Cassini REST, was @ApplicationPath("/") plus the war context root ---
# Mounted under /api so it cannot collide with the health endpoint.
vidocq.http.mount.api.path=/api
vidocq.http.mount.api.type=restful

# --- Mansart pool (was <dataSource> + <jdbcDriver> + <library> and the jdbc/... JNDI name) ---
# Liberty took the URL from IO_GITHUB_BMARWELL_SOCIAL_METRICBOT_H2_DB; an in-memory default
# keeps the application startable without external setup.
vidocq.pool.url=jdbc:h2:mem:metricbot;DB_CLOSE_DELAY=-1
vidocq.pool.username=sa
vidocq.pool.maxSize=8
vidocq.pool.acquireTimeout=PT5S
